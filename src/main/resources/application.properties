# ============================================
# CONFIGURACIÓN JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
# ✅ 'update' es seguro para desarrollo, crea/modifica tablas automáticamente
# ⚠️ En producción usar 'validate' o 'none'

spring.jpa.show-sql=true
# ✅ Muestra las consultas SQL en consola (útil para depuración)
# ⚠️ En producción poner 'false' por rendimiento

# ============================================
# ESTRATEGIAS DE NAMING (NOMBRES DE TABLAS)
# ============================================
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# ✅ Mantiene los nombres exactos de las tablas (respeta mayúsculas/minúsculas)

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
# ✅ Usa la estrategia JPA legacy para nombres implícitos

# ============================================
# CONFIGURACIÓN DE FECHAS (JSON)
# ============================================
spring.jackson.date-format=yyyy-MM-dd
# ✅ Formato de fechas en respuestas JSON

spring.jackson.serialization.write-dates-as-timestamps=false
# ✅ Escribe fechas como string (yyyy-MM-dd) en lugar de timestamps numéricos

# ============================================
# OPCIONES DE DDL (COMENTADAS PARA REFERENCIA)
# ============================================
# Los siguientes son diferentes modos de DDL-auto
# Explicación de cada uno:
#
# spring.jpa.hibernate.ddl-auto=create
# ❌ PELIGRO: Elimina todas las tablas y las crea de nuevo (pierdes datos)
#
# spring.jpa.hibernate.ddl-auto=create-drop
# ❌ PELIGRO: Crea tablas al iniciar y las elimina al cerrar (solo pruebas)
#
# spring.jpa.hibernate.ddl-auto=create-only
# ⚠️ Solo crea tablas si no existen (no actualiza)
#
# spring.jpa.hibernate.ddl-auto=drop
# ❌ PELIGRO EXTREMO: Elimina todas las tablas
#
# spring.jpa.hibernate.ddl-auto=none
# ✅ SEGURO: No modifica la estructura de la base de datos
#
# spring.jpa.hibernate.ddl-auto=truncate
# ⚠️ Vacía todas las tablas (elimina datos pero mantiene estructura)
#
# spring.jpa.hibernate.ddl-auto=validate
# ✅ SEGURO: Solo valida que las entidades coincidan con la BD (no hace cambios)
#
# Actualmente usando 'update' que es seguro para desarrollo
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.hibernate.ddl-auto=create-only
#spring.jpa.hibernate.ddl-auto=drop
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=truncate
#spring.jpa.hibernate.ddl-auto=validate

# ============================================
# CONFIGURACIONES ADICIONALES PARA YUGABYTE
# ============================================
# YugabyteDB es compatible con PostgreSQL, pero tiene algunas particularidades
# Configuración de pool de conexiones (ajusta según necesidad)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Timeout para transacciones largas (útil en YugabyteDB)
spring.jpa.properties.jdbc.timeout=30000

# ============================================
# CONFIGURACIÓN PARA SUBIR ARCHIVOS (MULTIPART)
# ============================================
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
spring.servlet.multipart.enabled=true

# ============================================
# CONFIGURACIÓN PARA ENVIAR CORREOS
# ============================================
# SMTP para Spring Mail
mailgun.api.key=${MAIL_API_KEY}
mailgun.domain=${MAIL_DOMAIN}
mailgun.from=${MAIL_FROM}